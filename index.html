<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧物流监测系统 - 登录界面</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f4c81, #2196f3); overflow: hidden; }
        .bg-decoration { position: absolute; width: 100%; height: 100%; overflow: hidden; z-index: 0; }
        .bg-decoration .circle { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.1); animation: float 15s infinite ease-in-out; }
        .circle:nth-child(1) { width: 200px; height: 200px; top: 10%; left: 10%; }
        .circle:nth-child(2) { width: 150px; height: 150px; top: 70%; right: 15%; animation-delay: 3s; }
        .circle:nth-child(3) { width: 120px; height: 120px; bottom: 20%; left: 30%; animation-delay: 6s; }
        @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-30px) rotate(180deg); } }
        
        .container { position: relative; z-index: 1; width: 850px; height: 550px; background: rgba(255, 255, 255, 0.95); border-radius: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2); overflow: hidden; display: flex; }
        .info-panel { width: 40%; background: linear-gradient(180deg, #2196f3, #0f4c81); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        .info-panel h2 { font-size: 28px; margin-bottom: 15px; }
        .info-panel p { font-size: 14px; opacity: 0.9; line-height: 1.6; }
        .info-panel .logo { font-size: 50px; margin-bottom: 20px; }

        .form-panel { width: 60%; padding: 40px 50px; display: flex; flex-direction: column; justify-content: center; }

        .role-selection { display: flex; gap: 20px; margin-bottom: 25px; justify-content: center; }
        .role-item { cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #555; padding: 8px 15px; border: 1px solid #eee; border-radius: 8px; transition: 0.3s; }
        .role-item input { display: none; }
        .role-item:hover { background: #f8f9fa; }
        .role-item.selected { border-color: #2196f3; background: rgba(33, 150, 243, 0.05); color: #2196f3; font-weight: bold; }

        .form { display: flex; flex-direction: column; gap: 18px; }
        .input-group { position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #2196f3; }
        .input-group input { width: 100%; padding: 12px 15px 12px 45px; border: 2px solid #eee; border-radius: 10px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #2196f3; }

        .remember-forgot { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .submit-btn { padding: 12px; background: linear-gradient(90deg, #2196f3, #0f4c81); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3); }

        @media (max-width: 768px) { .container { width: 90%; height: auto; flex-direction: column; } .info-panel, .form-panel { width: 100%; } }
    </style>
</head>
<body>
    <div class="bg-decoration">
        <div class="circle"></div><div class="circle"></div><div class="circle"></div>
    </div>

    <div class="container">
        <div class="info-panel">
            <div class="logo"><i class="fas fa-shipping-fast"></i></div>
            <h2>智慧物流系统</h2>
            <p>基于云端的实时监测与设备管理平台</p>
        </div>

        <div class="form-panel">
            <form class="form" id="loginForm">
                <div class="role-selection">
                    <label class="role-item selected" id="adminRole">
                        <input type="radio" name="role" value="admin" checked>
                        <i class="fas fa-user-shield"></i> 管理端
                    </label>
                    <label class="role-item" id="userRole">
                        <input type="radio" name="role" value="user">
                        <i class="fas fa-user"></i> 用户端
                    </label>
                </div>

                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="账号" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="密码" required>
                </div>
                <div class="remember-forgot">
                    <label style="color: #666;"><input type="checkbox"> 记住我</label>
                    <a href="#" style="color:#2196f3; text-decoration: none;">忘记密码？</a>
                </div>
                <button type="submit" class="submit-btn">进入系统</button>
            </form>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const roleItems = document.querySelectorAll('.role-item');

        // 角色选择视觉反馈
        roleItems.forEach(item => {
            item.addEventListener('click', () => {
                roleItems.forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');
                item.querySelector('input').checked = true;
            });
        });

        // 登录验证逻辑
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const selectedRole = document.querySelector('input[name="role"]:checked').value;

            // 账号密码配置
            const adminAccount = { user: "admin", pwd: "123456" };
            const userAccount = { user: "user", pwd: "123456" };

            if (!username || !password) {
                alert("请输入账号和密码！");
                return;
            }

            let success = false;
            if (selectedRole === 'admin') {
                if (username === adminAccount.user && password === adminAccount.pwd) {
                    success = true;
                }
            } else {
                if (username === userAccount.user && password === userAccount.pwd) {
                    success = true;
                }
            }

            if (success) {
                alert("登录成功！");
                if (selectedRole === 'admin') {
                    window.location.href = 'index.html';
                } else {
                    window.location.href = 'index2.html';
                }
            } else {
                alert("账号、密码或角色不匹配，请重试！");
            }
        });
    </script>
</body>
</html>
