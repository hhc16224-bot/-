<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧物流监测系统 - 用户版</title>
    <script type="text/javascript" src="https://api.map.baidu.com/api?v=3.0&ak=IFlmLHeIYd8QrqWxUvyZ2dCY6tkLhCQn"></script>
    <style>
        /* 样式完全继承管理端，确保视觉一致性 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body { background: linear-gradient(135deg, #0a2e4e, #162a3a); color: #ffffff; padding: 20px; min-height: 100vh; }
        .dashboard { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { font-size: 28px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 210, 255, 0.6); color: #00d2ff; }

        /* 数据卡片 */
        .data-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: rgba(0, 40, 80, 0.6); border: 1px solid rgba(0, 210, 255, 0.3); padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card h3 { font-size: 14px; color: #88a0b5; margin-bottom: 12px; }
        .card .value { font-size: 20px; font-weight: bold; color: #00ffcc; line-height:1.5; white-space: pre-wrap; }

        /* 主体展示区 */
        .main-content { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; margin-bottom: 20px; }
        .map-section, .chart-section { background: rgba(0, 20, 40, 0.5); border-radius: 12px; border: 1px solid rgba(0, 210, 255, 0.3); height: 400px; padding: 15px; }
        #mapContainer { width: 100%; height: 100%; border-radius: 8px; }

        /* 历史记录 */
        .history-section { background: rgba(0, 20, 40, 0.6); padding: 20px; border-radius: 12px; border: 1px solid rgba(0, 210, 255, 0.2); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        table th { color: #00d2ff; text-align: left; padding: 12px; border-bottom: 2px solid rgba(0, 210, 255, 0.3); }
        table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; color: #cbd5e0; }
        
        .api-info { font-size: 12px; text-align: center; color: #5c7891; margin-top: 10px; }
        @media (max-width: 768px) { .main-content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h1>智慧物流监测系统 <span style="font-size: 16px; vertical-align: middle; opacity: 0.7;">(用户版)</span></h1>
        <div id="status-bar" class="api-info">正在从云端同步物流数据...</div>
    </header>

    <div class="data-container">
        <div class="card"><h3>实时位置</h3><div class="value" id="pos-val">--</div></div>
        <div class="card"><h3>环境温度</h3><div class="value" id="temp-real">-- °C</div></div>
        <div class="card"><h3>环境湿度</h3><div class="value" id="hum-real">-- %</div></div>
        <div class="card"><h3>烟雾浓度</h3><div class="value" id="smoke-real">-- ppm</div></div>
    </div>

    <div class="main-content">
        <div class="map-section"><div id="mapContainer"></div></div>
        <div class="chart-section"><canvas id="realtimeChart"></canvas></div>
    </div>

    <div class="history-section">
        <h2 style="font-size: 18px; color: #00d2ff; margin-bottom: 15px;">实时物流数据记录</h2>
        <table>
            <thead>
                <tr>
                    <th>时间</th>
                    <th>位置坐标</th>
                    <th>温度 (°C)</th>
                    <th>湿度 (%)</th>
                    <th>烟雾 (ppm)</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    // ========== 格式化经纬度：36.39'34 → 36°39′34″ ==========
    function formatDMS(dmsStr) {
        if (!dmsStr) return "";
        let s = dmsStr.toString().trim();
        s = s.replace(/\./g, '°').replace(/'/g, '′') + '″';
        return s;
    }

    // ========== 度分秒转十进制（地图专用） ==========
    function dmsToDec(dmsStr) {
        if (!dmsStr) return 0;
        let clean = dmsStr.toString().replace(/[^0-9\.'"]/g, '');
        let parts = clean.split(/\.|'|"/).filter(p => p);
        let deg = parseFloat(parts[0] || 0);
        let min = parseFloat(parts[1] || 0);
        let sec = parseFloat(parts[2] || 0);
        return deg + min / 60 + sec / 3600;
    }

    // ========== OneNET 核心配置 (与管理端共用) ==========
    const CONFIG = {
        URL: "https://iot-api.heclouds.com/thingmodel/query-device-property",
        TOKEN: "version=2018-10-31&res=products%2FjIef92aY49%2Fdevices%2Fbishe&et=1782806097&method=md5&sign=lzDWUyLej0q%2F8f0s5DrJ%2Bg%3D%3D",
        QUERY: "product_id=jIef92aY49&device_name=bishe"
    };

    let map, marker, myChart;
    let curLng = 116.404, curLat = 39.915;
    let rawLat = "", rawLng = "";

    // 1. 同步云端数据
    async function syncCloudData() {
        try {
            const response = await fetch(`${CONFIG.URL}?${CONFIG.QUERY}`, {
                method: 'GET',
                headers: { 'Accept': 'application/json', 'authorization': CONFIG.TOKEN }
            });
            const res = await response.json();
            
            if (res.code === 0 && res.data) {
                const props = res.data;
                let dataToPush = { time: new Date().toLocaleTimeString(), temp: 0, humi: 0, smoke: 0 };
                let locUpdated = false;

                props.forEach(item => {
                    const id = item.identifier;
                    const val = item.value;

                    if (id === 'temp') { document.getElementById('temp-real').innerText = val + ' °C'; dataToPush.temp = val; }
                    if (id === 'humi') { document.getElementById('hum-real').innerText = val + ' %'; dataToPush.humi = val; }
                    if (id === 'mq135_ppm') { document.getElementById('smoke-real').innerText = parseFloat(val).toFixed(1) + ' ppm'; dataToPush.smoke = val; }
                    if (id === 'longitude') { rawLng = val; curLng = dmsToDec(val); locUpdated = true; }
                    if (id === 'latitude') { rawLat = val; curLat = dmsToDec(val); locUpdated = true; }
                });

                if (locUpdated) {
                    let latStr = formatDMS(rawLat) + " N";
                    let lngStr = formatDMS(rawLng) + " E";
                    document.getElementById('pos-val').innerText = `${latStr}\n${lngStr}`;
                    updateBaiduMap(curLng, curLat);
                }

                updateDashboard(dataToPush);
                document.getElementById('status-bar').innerText = `同步成功：${new Date().toLocaleTimeString()} (数据连接正常)`;
            }
        } catch (err) {
            document.getElementById('status-bar').innerText = "同步异常，请检查网络状态";
        }
    }

    // 2. 地图更新
    function updateBaiduMap(lng, lat) {
        if (map && marker) {
            let point = new BMap.Point(lng, lat);
            marker.setPosition(point);
            map.panTo(point);
        }
    }

    // 3. UI 初始化
    function initApp() {
        // 初始化百度地图
        map = new BMap.Map("mapContainer");
        let startPoint = new BMap.Point(curLng, curLat);
        map.centerAndZoom(startPoint, 15);
        map.enableScrollWheelZoom(true);
        marker = new BMap.Marker(startPoint);
        map.addOverlay(marker);

        // 初始化趋势图 (Chart.js)
        const ctx = document.getElementById('realtimeChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: '温度', data: [], borderColor: '#ff6b6b', tension: 0.3, fill: false },
                    { label: '湿度', data: [], borderColor: '#4ecdc4', tension: 0.3, fill: false }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { ticks: { color: '#88a0b5' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                    y: { ticks: { color: '#88a0b5' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                },
                plugins: { legend: { labels: { color: '#88a0b5' } } }
            }
        });
    }

    // 4. 更新图表与表格
    function updateDashboard(data) {
        if (myChart) {
            myChart.data.labels.push(data.time);
            myChart.data.datasets[0].data.push(data.temp);
            myChart.data.datasets[1].data.push(data.humi);
            if (myChart.data.labels.length > 8) {
                myChart.data.labels.shift();
                myChart.data.datasets.forEach(d => d.data.shift());
            }
            myChart.update();
        }

        const latShow = formatDMS(rawLat);
        const lngShow = formatDMS(rawLng);
        const locationStr = `${latShow}N ${lngShow}E`;

        const tbody = document.getElementById('historyBody');
        const row = `<tr>
            <td>${data.time}</td>
            <td>${locationStr}</td>
            <td>${data.temp}</td>
            <td>${data.humi}</td>
            <td>${data.smoke}</td>
        </tr>`;
        tbody.insertAdjacentHTML('afterbegin', row);
        if (tbody.rows.length > 10) tbody.deleteRow(10);
    }

    // 启动
    window.onload = () => {
        initApp();
        syncCloudData();
        setInterval(syncCloudData, 10000); 
    };
</script>
</body>
</html>
